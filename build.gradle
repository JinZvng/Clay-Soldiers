plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.1.0-26.3'
group = 'com.matthewperiut'
base { archivesName = 'clay-neoforge-26.3' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
neoForge {
    version = '26.3.0.101'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { clay { sourceSet(sourceSets.main) } }
}
dependencies {
    implementation 'dev.architectury:architectury-neoforge:21.0.5'
    implementation 'com.geckolib:geckolib-neoforge-26.3:5.5.7'
}
tasks.register('preparePortResources', Exec) {
    inputs.dir('common/src/main/resources')
    inputs.file('common/src/main/java/com/matthewperiut/clay/registry/ItemRegistry.java')
    inputs.file('tools/prepare_resources_26_3.py')
    outputs.dir(layout.buildDirectory.dir('migration-26.3/resources'))
    doFirst { delete(layout.buildDirectory.dir('migration-26.3/resources')) }
    commandLine 'python3', 'tools/prepare_resources_26_3.py'
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('migration-26.3/resources'))
tasks.named('processResources') {
    dependsOn 'preparePortResources'
    exclude 'clay.mixins.json', 'clay.accesswidener', 'architectury.common.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xmaxerrs', '1000']) }

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21 for the existing Minecraft 1.21 source
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Build existing NeoForge mod
        run: bash ./gradlew :neoforge:build --no-daemon --console=plain --stacktrace
      - name: Upload NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clay-neoforge-minecraft-1.21
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

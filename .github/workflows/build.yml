name: Build NeoForge 26.3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 26.3 port
        run: bash ./gradlew build --no-daemon --console=plain --stacktrace
      - name: Verify client startup in a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          set +e
          timeout --signal=TERM 360s xvfb-run -a bash ./gradlew runClient --no-daemon --console=plain
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            exit "$result"
          fi
          test -f run/logs/latest.log
          if rg -q 'Failed to load mods|ModLoadingException|NoSuchMethodError|NoClassDefFoundError|ReportedException|Exception in thread' run/logs/latest.log; then
            exit 1
          fi
          rg -q 'Created: .*atlas|Created .*atlas' run/logs/latest.log
      - name: Upload compiled port
        uses: actions/upload-artifact@v4
        with:
          name: clay-neoforge-26.3
          path: build/libs/*.jar
          if-no-files-found: error

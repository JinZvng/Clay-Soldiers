name: Build NeoForge 26.3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 26.3 port
        run: bash ./gradlew build --no-daemon --console=plain --stacktrace
      - name: Validate recipe item IDs against Minecraft 26.3
        run: python3 tools/check_recipe_items_26_3.py
      - name: Upload compiled port
        uses: actions/upload-artifact@v4
        with:
          name: clay-neoforge-26.3
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Set up software graphics for the client check
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils libopenal1
      - name: Verify client startup in a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
        run: python3 tools/check_client_startup.py

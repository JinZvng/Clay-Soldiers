name: Build NeoForge 26.3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 26.3 port
        run: bash ./gradlew build --no-daemon --console=plain --stacktrace
      - name: Upload compiled port
        uses: actions/upload-artifact@v4
        with:
          name: clay-neoforge-26.3
          path: build/libs/*.jar
          if-no-files-found: error
